<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strong Tracker PWA</title>
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root { --primary: #3b82f6; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .card { background: white; border-radius: 20px; box-shadow: 0 4px 15px -3px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .btn-primary { background: #3b82f6; color: white; font-weight: 700; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
        #logModal { backdrop-filter: blur(12px); }
        input[type="radio"] { accent-color: #3b82f6; width: 1.2rem; height: 1.2rem; }
    </style>
</head>
<body class="p-4 max-w-5xl mx-auto pb-24">

    <header class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Fitness Analytics</h1>
            <p id="vTag" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Build 2026.05.15.v10</p>
        </div>
        <button id="pwaInstallBtn" class="hidden bg-blue-600 text-white text-[10px] px-4 py-2 rounded-full font-black shadow-lg animate-bounce">
            INSTALL APP
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Left: Control Panel -->
        <div class="lg:col-span-1 space-y-6">
            <section class="card p-6">
                <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-4">Body Profile</h2>
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 mb-3">
                    <span class="text-xs font-bold text-slate-500">Weight (kg)</span>
                    <input type="number" id="userBodyWeight" step="0.1" class="w-16 bg-transparent text-right font-black text-blue-600 focus:outline-none" value="80">
                </div>
                <button id="wipeDataBtn" class="w-full bg-red-50 text-red-600 text-[10px] font-black py-3 rounded-xl border border-red-100 uppercase tracking-tighter">
                    Full Database Wipe
                </button>
            </section>

            <section class="card p-6">
                <h2 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-4">Data Entry</h2>
                <textarea id="importArea" 
                    class="w-full h-32 p-4 border border-slate-100 rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 outline-none custom-scrollbar mb-4 bg-slate-50/50"
                    placeholder="Paste text export..."></textarea>
                <div class="space-y-2">
                    <button id="processBtn" class="w-full btn-primary py-3 rounded-xl shadow-lg shadow-blue-100">
                        ANALYZE TEXT
                    </button>
                    
                    <label class="w-full bg-indigo-600 text-white text-[10px] font-bold py-3 rounded-xl hover:bg-indigo-700 transition flex items-center justify-center cursor-pointer shadow-lg shadow-indigo-100 uppercase">
                        Bulk CSV Import
                        <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                    </label>

                    <div class="grid grid-cols-2 gap-2">
                        <button id="showLogBtn" class="bg-slate-900 text-white text-[10px] font-bold py-3 rounded-xl uppercase">System Logs</button>
                        <button id="exportCsvBtn" class="bg-emerald-600 text-white text-[10px] font-bold py-3 rounded-xl uppercase">Backup DB</button>
                    </div>
                </div>
            </section>
        </div>

        <!-- Right: Charts -->
        <div class="lg:col-span-2 space-y-6">
            <section class="card p-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <h2 class="font-black text-slate-800 text-xl">Analytics</h2>
                    <div class="flex gap-2">
                        <select id="regionFilter" class="text-xs border-0 bg-slate-100 p-2 px-4 rounded-full font-bold text-slate-600">
                            <option value="all">Regions</option>
                            <option value="Chest">Chest</option>
                            <option value="Back">Back</option>
                            <option value="Legs">Legs</option>
                            <option value="Shoulders">Shoulders</option>
                            <option value="Core">Core</option>
                        </select>
                        <select id="exerciseFilter" class="text-xs border-0 bg-slate-100 p-2 px-4 rounded-full font-bold text-slate-600 max-w-[140px]">
                            <option value="">Exercise</option>
                        </select>
                    </div>
                </div>
                <div class="h-[350px] w-full">
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="mt-8 flex flex-wrap justify-center gap-6 border-t border-slate-50 pt-6">
                    <label class="text-[10px] font-black text-slate-400 flex items-center gap-2 cursor-pointer uppercase tracking-widest">
                        <input type="radio" name="metric" value="1rm" checked> Est. 1RM
                    </label>
                    <label class="text-[10px] font-black text-slate-400 flex items-center gap-2 cursor-pointer uppercase tracking-widest">
                        <input type="radio" name="metric" value="vol"> Volume
                    </label>
                    <label class="text-[10px] font-black text-slate-400 flex items-center gap-2 cursor-pointer uppercase tracking-widest">
                        <input type="radio" name="metric" value="index"> Index
                    </label>
                </div>
            </section>

            <section class="card p-6">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Workout History</h2>
                <div class="max-h-64 overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left text-sm">
                        <tbody id="historyTable" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <!-- Log Modal -->
    <div id="logModal" class="fixed inset-0 bg-slate-900/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[32px] w-full max-w-2xl h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-6 border-b bg-slate-50/50 flex justify-between items-center">
                <h3 class="font-black text-slate-900 uppercase text-xs">System Console</h3>
                <div class="flex gap-2">
                    <button id="clearLogsBtn" class="bg-red-50 text-red-600 text-[10px] font-black px-4 py-2 rounded-full">CLEAR</button>
                    <button id="copyLogBtn" class="bg-blue-600 text-white text-[10px] font-black px-4 py-2 rounded-full">COPY</button>
                    <button id="closeLogBtn" class="text-[10px] font-black text-slate-400 border px-4 py-2 rounded-full">CLOSE</button>
                </div>
            </div>
            <div id="logContent" class="flex-1 overflow-auto p-6 font-mono text-[10px] bg-slate-900 text-emerald-400 whitespace-pre custom-scrollbar"></div>
        </div>
    </div>

    <script>
        // Global Error Catcher for Android Debugging
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const logMsg = `ERR: ${msg} [Line ${lineNo}]`;
            addLog(logMsg);
            return false;
        };

        const KEY_DATA = 'strong_v10_db';
        const KEY_LOGS = 'strong_v10_logs';
        const KEY_PROF = 'strong_v10_prof';
        
        const REGIONS = {
            'Chest': ['chest', 'bench', 'dip', 'pec', 'pushup'],
            'Back': ['pull up', 'row', 'lat', 'back', 'extension', 'chin up'],
            'Legs': ['leg', 'squat', 'glute', 'quad', 'calf', 'hamstring', 'lunge', 'press'],
            'Shoulders': ['lateral', 'shoulder', 'overhead', 'military', 'press', 'deltoid'],
            'Core': ['crunch', 'abs', 'plank', 'sit up', 'knee raise']
        };

        const BW_LIFTS = ['pull up', 'dip', 'chin up', 'push up', 'lunge', 'squat (bodyweight)', 'sit up', 'crunch'];

        let workouts = [];
        let bodyWeight = 80;
        let chartInstance = null;

        function addLog(msg) {
            const logs = JSON.parse(localStorage.getItem(KEY_LOGS) || '[]');
            logs.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
            localStorage.setItem(KEY_LOGS, JSON.stringify(logs.slice(0, 300)));
            const container = document.getElementById('logContent');
            if(container) container.textContent = logs.join('\n');
        }

        function getEffectiveWeight(w, name) {
            if(!name) return w;
            const n = name.toLowerCase();
            if (n.includes('assisted')) return Math.max(0, bodyWeight - Math.abs(w));
            if (BW_LIFTS.some(l => n.includes(l))) return bodyWeight + w;
            return w;
        }

        function updateUI() {
            try {
                const sorted = [...workouts].sort((a, b) => b.date - a.date);
                const statW = document.getElementById('statWorkouts');
                const statE = document.getElementById('statExercises');
                
                const namesSet = new Set();
                workouts.forEach(w => w.exercises.forEach(e => namesSet.add(e.name)));
                
                if(statW) statW.textContent = workouts.length;
                if(statE) statE.textContent = namesSet.size;

                const exS = document.getElementById('exerciseFilter');
                if(exS) {
                    const prev = exS.value;
                    const reg = document.getElementById('regionFilter')?.value || 'all';
                    exS.innerHTML = '<option value="">Exercise</option>';
                    Array.from(namesSet).sort().forEach(n => {
                        const nLow = n.toLowerCase();
                        let r = 'Other';
                        for(let [regName, keys] of Object.entries(REGIONS)) {
                            if(keys.some(k => nLow.includes(k))) r = regName;
                        }
                        if (reg === 'all' || r === reg) {
                            const o = document.createElement('option');
                            o.value = n; o.textContent = n;
                            exS.appendChild(o);
                        }
                    });
                    exS.value = prev;
                }

                const hTable = document.getElementById('historyTable');
                if(hTable) {
                    hTable.innerHTML = sorted.slice(0, 30).map(w => `
                        <tr>
                            <td class="py-4 text-[10px] font-black text-slate-300 uppercase">${w.date.toLocaleDateString()}</td>
                            <td class="py-4 font-bold text-slate-700">${w.name}</td>
                            <td class="py-4 text-right text-slate-400 font-bold text-[10px]">${w.exercises.length} Lifts</td>
                        </tr>
                    `).join('');
                }
                renderChart();
            } catch (err) { addLog(`UI Error: ${err.message}`); }
        }

        function renderChart() {
            const canvas = document.getElementById('mainChart');
            if(!canvas) return;
            const lift = document.getElementById('exerciseFilter')?.value;
            const region = document.getElementById('regionFilter')?.value || "all";
            const metric = document.querySelector('input[name="metric"]:checked')?.value || "1rm";

            if (chartInstance) chartInstance.destroy();

            let data = [];
            let lbl = "";

            if (metric === 'index') {
                const pbs = {};
                workouts.forEach(w => w.exercises.forEach(ex => {
                    const max = Math.max(...ex.sets.map(s => getEffectiveWeight(s.weight, ex.name) * (1 + s.reps/30)));
                    if (!pbs[ex.name] || max > pbs[ex.name]) pbs[ex.name] = max;
                }));
                lbl = `${region} Index`;
                data = workouts.map(w => {
                    const rel = w.exercises.filter(ex => {
                        const nLow = ex.name.toLowerCase();
                        let r = 'Other';
                        for(let [regName, keys] of Object.entries(REGIONS)) {
                            if(keys.some(k => nLow.includes(k))) r = regName;
                        }
                        return region === 'all' || r === region;
                    });
                    if (!rel.length) return null;
                    const r = rel.map(ex => Math.max(...ex.sets.map(s => getEffectiveWeight(s.weight, ex.name) * (1 + s.reps/30))) / (pbs[ex.name] || 1));
                    return { x: w.date, y: (r.reduce((a, b) => a + b, 0) / r.length) * 100 };
                }).filter(d => d !== null);
            } else if (lift) {
                lbl = lift;
                data = workouts.map(w => {
                    const ex = w.exercises.find(e => e.name === lift);
                    if (!ex) return null;
                    let val = (metric === '1rm') 
                        ? Math.max(...ex.sets.map(s => getEffectiveWeight(s.weight, lift) * (1 + s.reps/30)))
                        : ex.sets.reduce((sum, s) => sum + (Math.abs(getEffectiveWeight(s.weight, lift)) * s.reps), 0);
                    return { x: w.date, y: val };
                }).filter(d => d !== null);
            } else { return; }

            if (!data.length) return;
            data.sort((a, b) => a.x - b.x);

            chartInstance = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: { datasets: [{ label: lbl, data, borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.05)' }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time' } } }
            });
        }

        // --- Controller Initialization ---

        function init() {
            addLog("System: App initialized.");
            
            // Load Local State
            workouts = JSON.parse(localStorage.getItem(KEY_DATA) || '[]');
            workouts.forEach(w => w.date = new Date(w.date));
            bodyWeight = parseFloat(localStorage.getItem(KEY_PROF) || '80');
            
            const bwIn = document.getElementById('userBodyWeight');
            if(bwIn) bwIn.value = bodyWeight;

            // Event Listeners (using direct attachment for mobile stability)
            document.getElementById('csvFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(!file) return;
                addLog(`File Picker: Found ${file.name}`);
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const content = ev.target.result;
                        const lines = content.split('\n');
                        const map = {};
                        for (let i = 1; i < lines.length; i++) {
                            const c = lines[i].split(';').map(v => v.replace(/"/g, '').trim());
                            if (c.length < 8 || c[5] === 'Rest Timer') continue;
                            const d = new Date(c[1].replace(' ', 'T'));
                            if (isNaN(d.getTime())) continue;
                            if (!map[c[0]]) map[c[0]] = { id: `${d.getTime()}-${c[2]}`, name: c[2], date: d, exercises: [] };
                            let ex = map[c[0]].exercises.find(e => e.name === c[4]);
                            if (!ex) { ex = { name: c[4], sets: [] }; map[c[0]].exercises.push(ex); }
                            ex.sets.push({ type: isNaN(parseInt(c[5])) ? c[5].charAt(0) : 'S', weight: parseFloat(c[6]) || 0, reps: parseInt(c[7]) || 0 });
                        }
                        const bulk = Object.values(map);
                        let added = 0;
                        bulk.forEach(w => { if(!workouts.some(x => x.id === w.id)) { workouts.push(w); added++; } });
                        localStorage.setItem(KEY_DATA, JSON.stringify(workouts));
                        addLog(`Import: Added ${added} workouts.`);
                        updateUI();
                    } catch (err) { addLog(`Parser Error: ${err.message}`); }
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            document.getElementById('wipeDataBtn').onclick = () => {
                if(confirm("Confirm: Delete all history?")) {
                    workouts = [];
                    localStorage.setItem(KEY_DATA, '[]');
                    updateUI();
                    addLog("System: Database cleared.");
                }
            };

            document.getElementById('clearLogsBtn').onclick = () => {
                localStorage.setItem(KEY_LOGS, '[]');
                addLog("System: Log buffer reset.");
            };

            document.getElementById('closeLogBtn').onclick = () => document.getElementById('logModal').style.display = 'none';
            document.getElementById('showLogBtn').onclick = () => document.getElementById('logModal').style.display = 'flex';
            document.getElementById('copyLogBtn').onclick = () => {
                const text = document.getElementById('logContent').textContent;
                const ta = document.createElement('textarea'); ta.value = text;
                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                document.body.removeChild(ta); addLog("Console: Logs copied.");
            };

            document.getElementById('regionFilter').onchange = updateUI;
            document.getElementById('exerciseFilter').onchange = renderChart;
            document.querySelectorAll('input[name="metric"]').forEach(i => i.onchange = renderChart);
            
            updateUI();
        }

        window.onload = init;
    </script>
</body>
</html>
